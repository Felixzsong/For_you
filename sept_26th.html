<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Gradient Page</title>
  <style>
    /* Reset margins and ensure the body covers the full viewport height */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Blue to white linear gradient */
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #ffffff 100%);
      color: #333;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    /* Styled rounded-edge button */
    .interactive-btn {
      background-color: #ffffff;
      color: #1e3c72;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 16px 32px;
      border: none;
      border-radius: 50px; /* Gives smooth rounded edges */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: all 0.3s ease;
      outline: none;
    }

    /* Hover and active effects */
    .interactive-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
      background-color: #f8f9fa;
    }

    .interactive-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

  <div class="container">
    <button id="messageBtn" class="interactive-btn">
      I know you have a lot going on....
    </button>
  </div>

  <script>
    const button = document.getElementById('messageBtn');

    button.addEventListener('click', () => {
      // Changes the text once clicked
      button.textContent = "Take a deep breath. You're doing great.";
    });
  </script>

</body>
</html>
